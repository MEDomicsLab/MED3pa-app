name: Build and publish Linux release
#
# Push a tag beginning with "u" (Ubuntu) to trigger a build, e.g.
#     git tag u0.1.0-alpha.1 && git push MED3paApp u0.1.0-alpha.1
#
# The tag minus its leading "u" becomes the version. Use the SAME version as the
# Windows tag: softprops/action-gh-release updates the release matching that
# version rather than creating a second one, so the .deb lands next to the .exe
# in one release instead of a separate Linux-only release.
on:
  push:
    tags:
      - "u*"
permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Node 22, not 18: electron-builder require()s @noble/hashes, which is pure
      # ESM at 2.x, and require() of an ES module needs Node 22.12+/20.19+.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write the tag into package.json
        shell: bash
        run: |
          VERSION=${GITHUB_REF/refs\/tags\//}
          NEW_VERSION="${VERSION#u}"
          node -p "let pkg=require('./package.json'); pkg.version='$NEW_VERSION'; require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));"

      - name: Print package.json
        run: cat package.json

      # npm ci installs exactly what package-lock.json pins.
      - name: Install dependencies
        run: npm ci

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.21

      # build:linux runs build_preparation_linux.sh, which cross-builds the Go
      # server into go_executables/ before invoking electron-builder.
      - name: Build for Linux
        run: npm run build:linux

      - name: Get tag name
        id: get-tag
        shell: bash
        run: |
          VERSION=${GITHUB_REF/refs\/tags\//}
          echo "VERSION=${VERSION#u}" >> "$GITHUB_OUTPUT"

      - name: List build output
        run: ls -la ./build/dist

      - name: Archive Linux package
        uses: actions/upload-artifact@v4
        with:
          name: linux-built
          path: ./build/dist/MED3pa-${{ steps.get-tag.outputs.VERSION }}-linux.deb
          compression-level: 0

  publish:
    needs: [build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: linux-built

      - name: Get tag name
        id: get-tag
        run: |
          VERSION=${GITHUB_REF/refs\/tags\//}
          echo "VERSION=${VERSION#u}" >> "$GITHUB_OUTPUT"

      - name: Zip the python environment files
        run: |
          sudo apt-get install -y zip
          zip -j MED3pa-PythonEnv-linux.zip ./pythonEnv/requirements.txt ./pythonEnv/create_conda_env.sh

      - name: Publish draft release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./MED3pa-${{ steps.get-tag.outputs.VERSION }}-linux.deb
            ./MED3pa-PythonEnv-linux.zip
          name: MED3pa-${{ steps.get-tag.outputs.VERSION }}
          body: |
            MED3pa standalone application — ${{ steps.get-tag.outputs.VERSION }}

            Debian/Ubuntu package. On first launch the app downloads a bundled
            CPython 3.12 and installs `pythonEnv/requirements.txt` into it; the
            System page shows that progress. MongoDB must be on PATH or
            installed through the first-time setup dialog.

            ${{ github.ref }}
          draft: true
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
