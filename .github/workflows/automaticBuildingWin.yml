name: Build and publish Windows release
#
# Push a tag beginning with "w" to trigger a build, e.g.
#     git tag w0.1.0-alpha.1 && git push origin w0.1.0-alpha.1
# The tag minus its leading "w" becomes the version written into package.json,
# so the tag is the single source of truth for the release number.
#
# The release is created as a DRAFT: nothing is public until you review the
# attached artifacts and press Publish in the GitHub UI.
on:
  push:
    tags:
      - "w*"
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Node 22, not the 18.13 MEDomicsLab pins. electron-builder's app-builder-lib
      # require()s @noble/hashes, which is pure ESM at 2.x; require() of an ES
      # module only works from Node 22.12+/20.19+, so on 18.13 packaging dies with
      # ERR_REQUIRE_ESM before producing an installer.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write the tag into package.json
        shell: bash
        run: |
          VERSION=${GITHUB_REF/refs\/tags\//}
          NEW_VERSION="${VERSION#w}"
          node -p "let pkg=require('./package.json'); pkg.version='$NEW_VERSION'; require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));"

      - name: Print package.json
        run: Get-Content package.json

      # npm ci installs exactly what package-lock.json pins, so CI resolves the
      # same tree that was verified locally instead of re-resolving on its own.
      - name: Install dependencies
        run: npm ci

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.21

      # MEDomicsLab compiles libmongocrypt here so mongodb-client-encryption ships
      # a native binary matching Electron's ABI. This app never enables CSFLE --
      # it opens a plain local MongoClient -- so the dependency was dropped and
      # the compile step with it.

      # build:win runs build_preparation_win.bat, which builds the Go server into
      # go_executables/ before invoking electron-builder.
      - name: Build for Windows
        run: npm run build:win

      - name: Get tag name
        id: get-tag
        shell: bash
        run: |
          VERSION=${GITHUB_REF/refs\/tags\//}
          echo "VERSION=${VERSION#w}" >> "$GITHUB_OUTPUT"

      - name: List build output
        shell: bash
        run: ls -la ./build/dist

      - name: Archive Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-built
          path: ./build/dist/MED3pa-${{ steps.get-tag.outputs.VERSION }}-win.exe
          compression-level: 0

  publish:
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-built

      - name: Get tag name
        id: get-tag
        run: |
          VERSION=${GITHUB_REF/refs\/tags\//}
          echo "VERSION=${VERSION#w}" >> "$GITHUB_OUTPUT"

      # Ship the python requirements alongside the installer so a user can
      # rebuild the environment by hand if the in-app installer fails.
      - name: Zip the python environment files
        run: |
          sudo apt-get install -y zip
          zip -j MED3pa-PythonEnv-win.zip ./pythonEnv/requirements.txt ./pythonEnv/create_conda_env.sh

      - name: Publish draft release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./MED3pa-${{ steps.get-tag.outputs.VERSION }}-win.exe
            ./MED3pa-PythonEnv-win.zip
          name: MED3pa-${{ steps.get-tag.outputs.VERSION }}
          body: |
            MED3pa standalone application — ${{ steps.get-tag.outputs.VERSION }}

            Windows installer. On first launch the app downloads a bundled
            CPython 3.12 and installs `pythonEnv/requirements.txt` into it; the
            System page shows that progress. MongoDB must be on PATH or
            installed through the first-time setup dialog.

            ${{ github.ref }}
          draft: true
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
