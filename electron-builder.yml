appId: com.medomics.med3pa
productName: MED3pa
artifactName: "${productName}-${version}-${os}.${ext}" # Added from package.json
copyright: Copyright © 2026 MEDomicsLab Team
# Fix for building on Windows when node-gyp is throwing errors on mongodb-client-encryption module
####
# nodeGypRebuild: false
npmRebuild: false
# npmArgs: "--build-from-source=false"
####
directories:
  output: build/dist # Changed from dist to build/dist to match package.json
  buildResources: resources
files:
  - app/**/*
  - resources/**/*
  - node_modules/**/* # Added from package.json
extraResources: # Add this section if it doesn't exist, or add the line to it
  - from: ./go_executables # Source directory
    to: go_executables # Destination directory inside Contents/Resources
    filter:
      - server_go
      - server_go_win32.exe
  - from: ./pythonCode # Source directory
    to: pythonCode # Destination directory inside Contents/Resources
    # Exclude pycache and other unnecessary files
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/*.pyo"
      - "!**/.git"
      - "!**/.git/**"
  - from: ./pythonEnv # Source directory
    to: pythonEnv # Destination directory inside Contents/Resources
    filter:
      - "**/*"
      - "!**/.git"
      - "!**/.git/**"

extends: null # Added from package.json
mac:
  # UNSIGNED build. MEDomicsLab signs and notarizes with a paid Apple Developer
  # account (CSC_LINK, APPLE_ID, APPLE_TEAM_ID and friends as repo secrets); this
  # app has no such credentials, so:
  #   - notarize must be false: notarization REQUIRES a Developer ID certificate
  #     and fails outright without one
  #   - identity "-" is AD-HOC signing: no certificate, no cost, but a real
  #     signature. Required, not optional: arm64 binaries must be signed to run
  #     at all, and macOS reports a wholly unsigned one as "damaged and can't be
  #     opened". identity: null means "skip signing" and breaks Apple Silicon.
  #   - hardenedRuntime must stay false alongside ad-hoc signing, or library
  #     validation rejects Electron's own pre-signed framework (different Team
  #     ID) and the app will not launch.
  # Users still get a Gatekeeper warning and must allow the app once under
  # System Settings > Privacy & Security > "Open Anyway". See README.
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  category: "public.app-category.developer-tools"
  # dmg only. An unsigned .pkg installer is treated far more harshly by macOS
  # than an unsigned .dmg, and the pkg target also pulls in build/pkg-scripts.
  target:
    - dmg
  notarize: false
win: # Added from package.json
  target: nsis
  icon: "app/assets/icon.ico"
nsis: {} # Added from package.json
linux: # Added from package.json
  target: deb
  icon: "resources/icons"
  maintainer: "medomicslab.udes@gmail.com"
deb: # Added from package.json
  afterInstall: "build/after-install.sh"
  depends:
    - curl
    - libcurl4
    - libssl3 | libssl1.1
afterPack: "build/afterPack.js" # Added from package.json
